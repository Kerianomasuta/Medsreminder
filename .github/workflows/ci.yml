name: CI Pipeline

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "BE/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "BE/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: BE

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BE/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Run Build
        run: npm run build:ci

      - name: Verify Docker Build
        run: |
          docker build --build-arg APP_NAME=api-gateway -t test-gateway .
          docker build --build-arg APP_NAME=user-service -t test-user .
          docker build --build-arg APP_NAME=medication-service -t test-medication .
          docker build --build-arg APP_NAME=pharmacy-order-service -t test-pharmacy .
          docker build --build-arg APP_NAME=ai-service -t test-ai .

      - name: Validate Compose Files
        run: |
          # .env files are gitignored; create empty placeholders so compose can resolve env_file
          touch apps/api-gateway/.env apps/user-service/.env apps/medication-service/.env apps/pharmacy-order-service/.env apps/ai-service/.env
          REGISTRY=ci IMAGE_TAG=ci docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.ollama.yml config -q

      - name: Guard - local model must stay out of production and CD
        run: |
          if grep -qi 'ollama' docker-compose.prod.yml; then
            echo "docker-compose.prod.yml must not reference the local model service"; exit 1
          fi
          if grep -qi 'ollama' "$GITHUB_WORKSPACE/.github/workflows/cd.yml"; then
            echo "cd.yml must not deploy the local model service"; exit 1
          fi
