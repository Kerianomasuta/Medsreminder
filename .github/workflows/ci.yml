name: CI Pipeline

on:
  push:
    branches: ["main", "dev", "develop"]
    paths:
      - "BE/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
  pull_request:
    branches: ["main", "dev", "develop"]
    paths:
      - "BE/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: BE

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BE/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Run Build
        run: npm run build:ci

      - name: Verify Docker Build
        run: |
          docker build --build-arg APP_NAME=api-gateway -t test-gateway .
          docker build --build-arg APP_NAME=user-service -t test-user .
          docker build --build-arg APP_NAME=medication-service -t test-medication .
          docker build --build-arg APP_NAME=pharmacy-order-service -t test-pharmacy .
          docker build --build-arg APP_NAME=ai-service -t test-ai .

      - name: Validate Compose Files
        run: |
          # .env files are gitignored; create empty placeholders so compose can resolve env_file
          touch apps/api-gateway/.env apps/user-service/.env apps/medication-service/.env apps/pharmacy-order-service/.env apps/ai-service/.env
          REGISTRY=ci IMAGE_TAG=ci docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.ollama.yml config -q

      - name: Guard - local model must stay out of production and CD
        run: |
          if grep -qi 'ollama' docker-compose.prod.yml; then
            echo "docker-compose.prod.yml must not reference the local model service"; exit 1
          fi
          if grep -qi 'ollama' "$GITHUB_WORKSPACE/.github/workflows/cd.yml"; then
            echo "cd.yml must not deploy the local model service"; exit 1
          fi

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: BE
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meds
          POSTGRES_PASSWORD: meds
          POSTGRES_DB: meds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meds"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/meds_test
      MEDICATION_DATABASE_URL: postgres://meds:meds@localhost:5432/meds_test
      MEDICATION_DB_SCHEMA: medication
      REDIS_URL: redis://localhost:6379
      ACCESS_JWT_SECRET: ci_access_secret
      REFRESH_JWT_SECRET: ci_refresh_secret
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BE/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Integration (e2e) Tests
        run: npm run test:e2e
