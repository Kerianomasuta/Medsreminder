name: CI Pipeline

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "BE/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "BE/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BE/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Run Build
        run: npm run build:ci

      - name: Verify Docker Build
        run: |
          docker build --build-arg APP_NAME=api-gateway -t test-gateway .
          docker build --build-arg APP_NAME=user-service -t test-user .
          docker build --build-arg APP_NAME=medication-service -t test-medication .
          docker build --build-arg APP_NAME=pharmacy-order-service -t test-pharmacy .
