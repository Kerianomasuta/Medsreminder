name: CD

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  push:
    name: Push ${{ matrix.app }}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api-gateway, user-service, medication-service, pharmacy-order-service, ai-service]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: BE
          file: BE/Dockerfile
          target: production
          push: true
          build-args: APP_NAME=${{ matrix.app }}
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.app }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.image.outputs.prefix }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy on EC2
    needs: push
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.push.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || { echo "Missing repository secret EC2_HOST"; exit 1; }
          test -n "$EC2_USER" || { echo "Missing repository secret EC2_USER"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "Missing repository secret EC2_SSH_KEY"; exit 1; }

      - name: Image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          REGISTRY: ${{ steps.image.outputs.prefix }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          envs: GHCR_TOKEN,GHCR_USER,REGISTRY,IMAGE_TAG,DEPLOY_PATH
          script: |
            set -eu
            if [ -z "${DEPLOY_PATH}" ]; then
              DEPLOY_PATH=/opt/medsreminder
            fi
            cd "${DEPLOY_PATH}"
            git pull --ff-only origin main
            cd BE
            test -n "${REGISTRY}" || { echo "REGISTRY was not passed to EC2"; exit 1; }
            test -n "${IMAGE_TAG}" || { echo "IMAGE_TAG was not passed to EC2"; exit 1; }
            test -n "${GHCR_TOKEN}" || { echo "GHCR_TOKEN was not passed to EC2"; exit 1; }
            if docker info >/dev/null 2>&1; then
              DOCKER=(docker)
            elif sudo docker info >/dev/null 2>&1; then
              DOCKER=(sudo docker)
            else
              echo "Docker is not available for this SSH user on EC2"
              exit 1
            fi
            echo "${GHCR_TOKEN}" | "${DOCKER[@]}" login ghcr.io -u "${GHCR_USER}" --password-stdin
            "${DOCKER[@]}" compose -f docker-compose.prod.yml pull
            "${DOCKER[@]}" rm -f meds-api-gateway meds-user-service meds-medication-service meds-pharmacy-order-service meds-ai-service || true
            "${DOCKER[@]}" compose -f docker-compose.prod.yml up -d --remove-orphans
            "${DOCKER[@]}" image prune -f
