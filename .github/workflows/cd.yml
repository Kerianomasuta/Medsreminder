name: CD

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  push:
    name: Push ${{ matrix.app }}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api-gateway, user-service, medication-service]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: BE
          file: BE/Dockerfile
          target: production
          push: true
          build-args: APP_NAME=${{ matrix.app }}
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.app }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.image.outputs.prefix }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy on VPS
    needs: push
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.push.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || { echo "Missing repository secret VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing repository secret VPS_USER"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Missing repository secret VPS_SSH_KEY"; exit 1; }

      - name: Image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          REGISTRY: ${{ steps.image.outputs.prefix }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          envs: GHCR_TOKEN,GHCR_USER,REGISTRY,IMAGE_TAG,DEPLOY_PATH
          script: |
            set -eu
            if [ -z "${DEPLOY_PATH}" ]; then
              DEPLOY_PATH=/opt/medsreminder
            fi
            cd "${DEPLOY_PATH}"
            git pull --ff-only origin main
            cd BE
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
