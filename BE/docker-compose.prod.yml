name: meds

services:
  api-gateway:
    image: ${REGISTRY}/api-gateway:${IMAGE_TAG}
    container_name: meds-api-gateway
    ports:
      - "3000:3000"
    env_file:
      - ./apps/api-gateway/.env
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=1024"
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 3529
      MEDICATION_SERVICE_HOST: medication-service
      MEDICATION_SERVICE_PORT: 3530
      PHARMACY_ORDER_SERVICE_HOST: pharmacy-order-service
      PHARMACY_ORDER_SERVICE_PORT: 3531
      AI_SERVICE_HOST: ai-service
      AI_SERVICE_PORT: 3532
    depends_on:
      - user-service
      - medication-service
      - pharmacy-order-service
      - ai-service
    networks:
      - meds-network
    restart: unless-stopped

  user-service:
    image: ${REGISTRY}/user-service:${IMAGE_TAG}
    container_name: meds-user-service
    env_file:
      - ./apps/user-service/.env
    environment:
      NODE_ENV: production
      USER_SERVICE_HOST: 0.0.0.0
      USER_SERVICE_PORT: 3529
      UV_THREADPOOL_SIZE: "16"
      NODE_OPTIONS: "--max-old-space-size=2048"
    expose:
      - "3529"
    networks:
      - meds-network
    restart: unless-stopped

  medication-service:
    image: ${REGISTRY}/medication-service:${IMAGE_TAG}
    container_name: meds-medication-service
    env_file:
      - ./apps/medication-service/.env
    environment:
      NODE_ENV: production
      MEDICATION_SERVICE_HOST: 0.0.0.0
      MEDICATION_SERVICE_PORT: 3530
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 3529
    expose:
      - "3530"
    networks:
      - meds-network
    restart: unless-stopped

  pharmacy-order-service:
    image: ${REGISTRY}/pharmacy-order-service:${IMAGE_TAG}
    container_name: meds-pharmacy-order-service
    env_file:
      - ./apps/pharmacy-order-service/.env
    environment:
      NODE_ENV: production
      PHARMACY_ORDER_SERVICE_HOST: 0.0.0.0
      PHARMACY_ORDER_SERVICE_PORT: 3531
      MEDICATION_SERVICE_HOST: medication-service
      MEDICATION_SERVICE_PORT: 3530
    expose:
      - "3531"
    networks:
      - meds-network
    restart: unless-stopped

  ai-service:
    image: ${REGISTRY}/ai-service:${IMAGE_TAG}
    container_name: meds-ai-service
    env_file:
      - ./apps/ai-service/.env
    environment:
      NODE_ENV: production
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 3532
      AI_BASE_URL: https://openrouter.ai/api/v1
      AI_MODEL: qwen/qwen2.5-vl-72b-instruct
    expose:
      - "3532"
    networks:
      - meds-network
    restart: unless-stopped

networks:
  meds-network:
    driver: bridge
